<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Otto - Control Central</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: linear-gradient(135deg, #1a237e 0%, #311b92 100%); min-height: 100vh; color: #333; }
        #login-screen { display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .login-card { background: white; border-radius: 20px; padding: 40px; width: 100%; max-width: 400px; text-align: center; }
        .login-btn { width: 100%; padding: 16px; background: #1a237e; color: white; border: none; border-radius: 10px; cursor: pointer; margin-top: 15px; font-weight: bold; }
        #dashboard-content { display: none; max-width: 1200px; margin: 0 auto; padding: 20px; }
        .panel { background: white; border-radius: 15px; padding: 25px; margin-bottom: 20px; }
        #map { height: 500px; width: 100%; border-radius: 10px; border: 2px solid #ddd; }
        .fiesta-btn { background: linear-gradient(135deg, #F00, #0F0, #00F); color: white; border: none; padding: 15px; border-radius: 10px; width: 100%; font-weight: bold; cursor: pointer; margin: 15px 0; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.02); } }
        .leyenda { display: flex; justify-content: center; gap: 15px; margin-top: 15px; flex-wrap: wrap; }
        .dot { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid #000; display: inline-block; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-card">
            <h2>🚇 SISTEMA OTTO</h2>
            <input type="password" id="pass" placeholder="Contraseña" style="width: 100%; padding: 12px; margin-top: 20px; border-radius: 8px; border: 1px solid #ccc;">
            <button class="login-btn" onclick="checkLogin()">INGRESAR</button>
        </div>
    </div>

    <div id="dashboard-content">
        <div class="panel">
            <h1>SISTEMA OTTO: PANEL CENTRAL</h1>
            <p id="stats-txt">Iniciando...</p>
        </div>
        <button onclick="activarModoFiesta()" class="fiesta-btn">🎉 MODO FIESTA</button>
        <div class="panel">
            <div id="map"></div>
            <div class="leyenda">
                <span><div class="dot" style="background: #2ecc71;"></div> Normal</span>
                <span><div class="dot" style="background: #f39c12;"></div> Alerta</span>
                <span><div class="dot" style="background: #e74c3c;"></div> Crítico</span>
                <span><div class="dot" style="background: #95a5a6;"></div> Offline</span>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // LISTADO EXTENDIDO DE ESTACIONES (Ejemplo representativo de las líneas)
        const estaciones = [
            { n: "Plaza de Mayo", l: "A", lat: -34.6083, lon: -58.3712, st: "ok" },
            { n: "Congreso", l: "A", lat: -34.6091, lon: -58.3924, st: "ok" },
            { n: "Acoyte", l: "A", lat: -34.6181, lon: -58.4363, st: "alerta" },
            { n: "San José de Flores", l: "A", lat: -34.6297, lon: -58.4633, st: "ok" },
            { n: "Leandro N. Alem", l: "B", lat: -34.6020, lon: -58.3705, st: "ok" },
            { n: "Callao", l: "B", lat: -34.6044, lon: -58.3925, st: "ok" },
            { n: "Lacroze", l: "B", lat: -34.5866, lon: -58.4554, st: "critico" },
            { n: "Juan Manuel de Rosas", l: "B", lat: -34.5744, lon: -58.4861, st: "ok" },
            { n: "Retiro", l: "C", lat: -34.5915, lon: -58.3755, st: "off" },
            { n: "Constitución", l: "C", lat: -34.6277, lon: -58.3813, st: "ok" },
            { n: "Catedral", l: "D", lat: -34.6076, lon: -58.3742, st: "ok" },
            { n: "Palermo", l: "D", lat: -34.5816, lon: -58.4210, st: "ok" },
            { n: "Congreso de Tucumán", l: "D", lat: -34.5558, lon: -58.4621, st: "ok" },
            { n: "Bolívar", l: "E", lat: -34.6097, lon: -58.3739, st: "ok" },
            { n: "Plaza de los Virreyes", l: "E", lat: -34.6433, lon: -58.4619, st: "ok" },
            { n: "Facultad de Derecho", l: "H", lat: -34.5833, lon: -58.3927, st: "ok" },
            { n: "Hospitales", l: "H", lat: -34.6417, lon: -58.4111, st: "ok" }
        ];

        let mapa, capasMarcadores = [];

        function checkLogin() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('dashboard-content').style.display = 'block';
            setTimeout(initMap, 100);
        }

        function initMap() {
            mapa = L.map('map').setView([-34.6037, -58.3816], 12);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapa);
            
            estaciones.forEach(est => {
                let color = est.st == "ok" ? "#2ecc71" : est.st == "alerta" ? "#f39c12" : est.st == "critico" ? "#e74c3c" : "#95a5a6";
                let m = L.circleMarker([est.lat, est.lon], {
                    radius: 9, fillColor: color, color: "#000", weight: 2, fillOpacity: 1
                }).addTo(mapa).bindPopup(`<b>${est.n}</b> (Línea ${est.l})`);
                capasMarcadores.push(m);
            });
            document.getElementById('stats-txt').innerText = `Sistema Otto monitoreando ${estaciones.length} puntos estratégicos.`;
        }

        function activarModoFiesta() {
            setInterval(() => {
                capasMarcadores.forEach(m => {
                    m.setStyle({ 
                        fillColor: '#' + Math.floor(Math.random()*16777215).toString(16),
                        color: '#FFF' 
                    });
                });
            }, 200);
        }
    </script>
</body>
</html>
